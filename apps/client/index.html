<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0806" />
    <title>댕순 — 같이 보는 불멍</title>
    <meta name="description" content="모르는 사람들과 같은 모닥불을 바라보는 곳. 물멍도 됩니다." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <main id="hud" aria-live="polite">
      <header class="top">
        <h1 class="brand">댕순</h1>
        <p class="viewers"><span id="viewer-count">1</span>명이 함께 보고 있어요</p>
      </header>

      <footer class="bottom">
        <div class="modes" role="tablist" aria-label="멍 종류">
          <button class="mode" data-mode="fire" role="tab" aria-selected="true">🔥 불멍</button>
          <button class="mode" data-mode="water" role="tab" aria-selected="false">🌊 물멍</button>
        </div>
        <button id="poke" class="poke">장작 넣기</button>
        <div class="tools">
          <button id="sound" class="icon" aria-pressed="false" title="소리 켜기/끄기">🔇</button>
          <button id="fullscreen" class="icon" title="전체화면">⛶</button>
        </div>
      </footer>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
