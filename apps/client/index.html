<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0806" />
    <title>댕순 — 같이 보는 불멍</title>
    <meta name="description" content="모르는 사람들과 모닥불 주위에 앉아, 태우고 싶은 걸 태우는 곳." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="loading" class="loading" hidden><div class="dot"></div><p>불 피우는 중…</p></div>

    <div id="tags" class="tags" aria-hidden="true"></div>

    <main id="hud">
      <header class="top">
        <button id="room-btn" class="pill room" title="다른 캠프 보기">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l-5-5 5-5M15 12H5"/></svg>
          <span id="room-name" class="room-name">캠프 찾는 중</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dim"><path d="M6 9l6 6 6-6"/></svg>
          <span class="count"><span id="viewer-count">–</span><span class="dim">/20</span></span>
        </button>
        <div class="pill tools">
          <button id="sound" class="icon" aria-pressed="false" title="소리 켜기/끄기">
            <svg id="sound-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/></svg>
            <svg id="sound-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M11 5L6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 010 7M19 5a9 9 0 010 14"/></svg>
          </button>
          <button id="fullscreen" class="icon" title="전체화면">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/></svg>
          </button>
        </div>
      </header>

      <footer class="bottom">
        <section class="card" id="status-card">
          <div class="card-row">
            <span class="chip" id="status-chip">걷는 중</span>
            <strong id="status-title">캠프 찾는 중</strong>
            <span class="card-right" id="status-right"></span>
          </div>
          <p class="card-line" id="status-line">이 캠프에 지금 –명이 같이 있어요</p>
          <p class="card-sub" id="status-sub">조이스틱으로 걷기 · 화면 쓸어서 둘러보기 · 통나무 옆에서 앉기</p>
        </section>

        <div id="burn-sheet" class="burn-sheet" hidden>
          <div class="items" id="items"></div>
        </div>

        <div class="controls">
          <div id="joystick" class="joystick" aria-label="걷기 조이스틱"><div class="knob" id="knob"></div></div>
          <div class="control-right">
            <button id="act-stand" class="mini" hidden>
              <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v6l-3 7M12 13l3 7M8 10l4-2 4 2"/></svg>
              <span>일어나기</span>
            </button>
            <button id="act-camp" class="mini">
              <svg viewBox="0 0 24 24"><path d="M3 20l9-15 9 15H3z"/><path d="M9 20l3-6 3 6"/></svg>
              <span>캠프</span>
            </button>
            <button id="act-main" class="big">
              <svg id="icon-sit" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v5l4 2v6M12 12l-4 2v6M6 20h12"/></svg>
              <svg id="icon-burn" viewBox="0 0 24 24" hidden><path d="M12 3c1 3 4 4 4 8a4 4 0 01-8 0c0-2 1-3 1-3s0 2 2 2c0-3-1-5 1-7z"/><path d="M8 14c-1 1-2 2.5-2 4a6 6 0 0012 0c0-1.5-1-3-2-4"/></svg>
              <span id="act-main-label">앉기</span>
              <small id="act-main-sub">통나무 근처에서</small>
            </button>
          </div>
        </div>
      </footer>
    </main>

    <div id="toast" class="toast" hidden></div>

    <section id="lobby" class="lobby" aria-label="시작 화면">
      <div class="lobby-inner">
        <div class="brand-mark">댕순</div>
        <p class="eyebrow">오늘은 뭘 태울까?</p>
        <h1 class="hero-title"><span class="mark">불멍</span>할 사람</h1>
        <p class="lead">모르는 사람들이랑 모닥불에 둘러앉아, 태우고 싶은 걸 태우고 가요. 말은 안 해도 돼요.</p>
        <div class="live"><span class="dot"></span><span id="live-text">불을 피우는 중…</span></div>

        <form id="entry-form" class="panel">
          <h2>누구신가요?</h2>
          <p class="panel-sub">나이와 성별로 얼굴이 정해져요. 이름은 캠프에서 지어 줍니다.</p>
          <div class="field two">
            <div>
              <span class="field-label">나이</span>
              <div class="chips" id="age-chips">
                <label><input type="radio" name="age" value="10" /><span>10대</span></label>
                <label><input type="radio" name="age" value="20" checked /><span>20대</span></label>
                <label><input type="radio" name="age" value="30" /><span>30대</span></label>
                <label><input type="radio" name="age" value="40" /><span>40대</span></label>
                <label><input type="radio" name="age" value="50" /><span>50대</span></label>
                <label><input type="radio" name="age" value="60" /><span>60대</span></label>
              </div>
            </div>
            <div>
              <span class="field-label">성별</span>
              <div class="chips">
                <label><input type="radio" name="gender" value="m" checked /><span>남</span></label>
                <label><input type="radio" name="gender" value="f" /><span>여</span></label>
              </div>
            </div>
          </div>
          <div class="field" id="kind-field">
            <span class="field-label">어디로 갈까요</span>
            <div class="chips kinds">
              <label><input type="radio" name="kind" value="mountain" checked /><span>🏔️ 산<small>귀뚜라미 소리</small></span></label>
              <label><input type="radio" name="kind" value="sea" /><span>🌊 바다<small>파도 소리</small></span></label>
            </div>
          </div>
          <div class="cta">
            <button type="submit" class="go" id="go-auto">불 앞에 앉으러 가기</button>
          </div>
        </form>
        <p class="foot">설치 없이 폰 · PC 브라우저에서 바로</p>
      </div>
    </section>

    <dialog id="rooms" class="rooms">
      <h2>캠프 고르기</h2>
      <ul id="room-list"></ul>
      <button id="rooms-close" class="pill">닫기</button>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
