<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0806" />
    <title>댕순 — 같이 보는 불멍</title>
    <meta name="description" content="모르는 사람들과 모닥불 주위에 앉아, 태우고 싶은 걸 태우는 곳." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="loading" class="loading" hidden><div class="dot"></div><p>불 피우는 중…</p></div>

    <div id="tags" class="tags" aria-hidden="true"></div>

    <main id="hud">
      <header class="top">
        <button id="room-btn" class="pill room" title="다른 캠프 보기">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l-5-5 5-5M15 12H5"/></svg>
          <span id="room-name" class="room-name">캠프 찾는 중</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dim"><path d="M6 9l6 6 6-6"/></svg>
          <span class="count"><span id="viewer-count">–</span><span class="dim">/20</span></span>
        </button>
        <div class="pill tools">
          <button id="sound" class="icon" aria-pressed="false" title="소리 켜기/끄기">
            <svg id="sound-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/></svg>
            <svg id="sound-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M11 5L6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 010 7M19 5a9 9 0 010 14"/></svg>
          </button>
          <button id="fullscreen" class="icon" title="전체화면">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/></svg>
          </button>
        </div>
      </header>

      <footer class="bottom">
        <p id="hint" class="hint">땅을 누르면 걸어가요 · 쓸어서 둘러보기 · 통나무를 누르면 앉아요</p>
        <div id="burn-bar" class="burn-bar" hidden>
          <div class="items" id="items"></div>
          <button id="stand" class="item stand">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v6l-3 7M12 13l3 7M8 10l4-2 4 2"/></svg>
            <span>일어나기</span>
          </button>
        </div>
      </footer>
    </main>

    <div id="toast" class="toast" hidden></div>

    <dialog id="entry" class="entry">
      <form method="dialog" id="entry-form">
        <h2>당신은 누구신가요?</h2>
        <p class="sub">말은 안 해도 돼요. 불 옆에 앉을 사람이 누군지만 알려주세요.</p>

        <fieldset>
          <legend>성별</legend>
          <div class="chips" id="gender-chips">
            <label><input type="radio" name="gender" value="m" checked /><span>남자</span></label>
            <label><input type="radio" name="gender" value="f" /><span>여자</span></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>나이</legend>
          <div class="chips" id="age-chips">
            <label><input type="radio" name="age" value="10" /><span>10대</span></label>
            <label><input type="radio" name="age" value="20" checked /><span>20대</span></label>
            <label><input type="radio" name="age" value="30" /><span>30대</span></label>
            <label><input type="radio" name="age" value="40" /><span>40대</span></label>
            <label><input type="radio" name="age" value="50" /><span>50대</span></label>
            <label><input type="radio" name="age" value="60" /><span>60대</span></label>
          </div>
        </fieldset>

        <fieldset id="kind-field">
          <legend>어디로 갈까요</legend>
          <div class="chips kinds">
            <label><input type="radio" name="kind" value="mountain" checked /><span>🏔️ 산<small>귀뚜라미 소리</small></span></label>
            <label><input type="radio" name="kind" value="sea" /><span>🌊 바다<small>파도 소리</small></span></label>
          </div>
        </fieldset>

        <button type="submit" class="go">불 옆에 앉으러 가기</button>
      </form>
    </dialog>

    <dialog id="rooms" class="rooms">
      <h2>캠프 고르기</h2>
      <ul id="room-list"></ul>
      <button id="rooms-close" class="pill">닫기</button>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
